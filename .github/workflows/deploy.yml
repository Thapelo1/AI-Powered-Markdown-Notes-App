name: CI and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Audit and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build

  deploy:
    name: Deploy to Render
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: render-production
      cancel-in-progress: false
    steps:
      - name: Require Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error title=Missing Render deploy hook::Add RENDER_DEPLOY_HOOK_URL to the production GitHub environment secret: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/settings/environments/production"
            exit 1
          fi
          if [[ "$RENDER_DEPLOY_HOOK_URL" != https://* ]]; then
            echo "::error title=Invalid Render deploy hook::RENDER_DEPLOY_HOOK_URL must be an HTTPS URL."
            exit 1
          fi
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 30 --request POST "$RENDER_DEPLOY_HOOK_URL"
